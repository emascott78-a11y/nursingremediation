  <div class="meta" id="headMeta">Not started</div>

<main><div class="card" id="app"></div></main>
<script>
const DATA={"pre": [{"q": "According to NCSBN, accountability most closely means:", "opts": ["Being responsible and answerable for one's actions and inactions", "Following directions only when reminded", "Transferring responsibility to a supervisor", "Avoiding responsibility when an error was unintentional"], "a": 0}, {"q": "Which circumstance is most central to an abandonment analysis?", "opts": ["Whether the nurse accepted responsibility for the patient assignment", "Whether the nurse was paid for the shift", "Whether the patient complained", "Whether the nurse had worked there before"], "a": 0}, {"q": "A nurse who cannot report for an assigned shift should first:", "opts": ["Wait to see whether anyone notices", "Notify the appropriate supervisor/faculty according to policy as soon as possible", "Ask another student to cover without telling faculty", "Send a group message only"], "a": 1}, {"q": "Why can a sole-provider no-call/no-show be especially serious?", "opts": ["It always results in criminal charges", "It may leave the patient without the expected nursing care and without time to arrange coverage", "It affects payroll more than patient care", "It is serious only if a medication is missed"], "a": 1}, {"q": "True or False: If no patient injury occurs, a no-call/no-show cannot be a significant patient-safety concern.", "opts": ["True", "False"], "a": 1}, {"q": "Which is the strongest prevention strategy?", "opts": ["Rely on memory", "Wait for faculty reminders", "Use the official schedule, redundant reminders, recheck 48 hours and the night before", "Ask classmates every morning"], "a": 2}, {"q": "NCSBN Model Rules define abandonment as intentionally leaving a patient for whom the nurse is responsible without:", "opts": ["Completing payroll paperwork", "Providing another nurse or appropriate caretaker to assume care", "Calling a family member", "Documenting the reason"], "a": 1}, {"q": "A scheduling mistake:", "opts": ["Automatically removes professional responsibility", "May explain what happened but does not transfer responsibility for verifying the schedule", "Is solely the faculty's responsibility", "Can never affect patient safety"], "a": 1}, {"q": "When a nurse follows an appropriate call-out process, the most important patient-safety benefit is:", "opts": ["The absence disappears from the record", "The organization has an opportunity to arrange coverage and continuity of care", "The nurse cannot be disciplined", "The patient does not need to be notified"], "a": 1}, {"q": "Boards of nursing primarily exist to:", "opts": ["Protect employers", "Protect the public", "Set hospital salaries", "Schedule nurses"], "a": 1}], "screens": [{"title": "Professional accountability is a patient-safety responsibility", "body": "Nursing is a profession in which other people depend on you to appear when you have accepted a responsibility. A clinical schedule is therefore more than an academic calendar. It identifies when the nursing program, clinical agency, faculty, patients, and other members of the healthcare team expect you to fulfill a defined responsibility.\n\nNCSBN describes accountability as being responsible and answerable for actions or inactions. That concept matters here because failing to report is an omission: something the nurse or nursing student was expected to do did not occur.\n\nProfessional accountability includes knowing your schedule, confirming the location and reporting time, preparing appropriately, and communicating promptly if an emergency prevents attendance.", "q": "What does accountability include in this context?", "opts": ["Only actions a nurse intentionally takes", "Actions and inactions for which the nurse is responsible", "Only conduct that causes injury", "Only employer policies"], "a": 1, "sec": 150}, {"title": "Why clinical attendance differs from classroom attendance", "body": "Missing a classroom lecture primarily affects the student's own educational experience. Missing an assigned clinical experience can affect many other people and systems.\n\nClinical agencies plan for students and faculty. Faculty plan supervision. Patients may be incorporated into learning experiences. Staff may expect assistance, observation, communication, or student participation. In some experiences, an assigned individual may be the expected provider for a defined episode of care.\n\nThis is why attendance, punctuality, and notification are routinely treated as professionalism issues in nursing education\u2014not simply as academic participation.", "q": "What makes clinical attendance different from ordinary classroom attendance?", "opts": ["It can affect patient care and other people who planned around the assignment", "Clinical is always graded more heavily", "Class attendance never matters", "Clinical absences are always illegal"], "a": 0, "sec": 150}, {"title": "Knowing the schedule is an individual responsibility", "body": "A professional schedule must be actively managed. Faculty, employers, agencies, and supervisors may send reminders, but reminders do not transfer responsibility for knowing an assigned shift.\n\nA safe system uses the official schedule as the source of truth. Each shift should be entered into a reliable calendar when the schedule is released. The schedule should then be rechecked periodically and again before the clinical day.\n\nA statement such as \u201cI did not know I was scheduled\u201d may describe how the event occurred. It does not, by itself, establish that the professional responsibility belonged to someone else.", "q": "Which statement best demonstrates professional accountability?", "opts": ["Faculty should remind me before every clinical", "I am responsible for verifying my official schedule", "A classmate should tell me when I am scheduled", "If I forget, the responsibility shifts to the program"], "a": 1, "sec": 150}, {"title": "The difference between an explanation and accountability", "body": "An explanation answers, \u201cHow did this happen?\u201d Accountability answers, \u201cWhat responsibility did I have, and what will I change?\u201d\n\nExamples of explanations include: I misread the schedule; I thought the date had changed; I did not see the announcement; I forgot to enter the shift into my calendar.\n\nAccountability requires the next step: identifying the point at which the event could have been prevented and creating a specific system to prevent recurrence.\n\nProfessional remediation is not complete when the individual can explain the error. It is complete when the individual understands the risk, accepts appropriate responsibility, and changes behavior.", "q": "Which response reflects accountability rather than only explanation?", "opts": ["I forgot the date", "No one reminded me", "I will use the official schedule, add two alerts, and verify each shift 48 hours before", "The calendar was confusing"], "a": 2, "sec": 150}, {"title": "LSBN guidance: patient abandonment", "body": "The Louisiana State Board of Nursing has published guidance on patient abandonment. LSBN explains that the concept involves a nurse who has accepted a patient assignment and then severs the nurse-patient relationship without reasonable notice to the appropriate person so arrangements can be made for continuation of nursing care.\n\nThe key ideas are acceptance of responsibility, reasonable notice, and continuity of care.\n\nLSBN notes that its Nurse Practice Act and rules do not specifically define \u201cpatient abandonment,\u201d and its guidance references the NCSBN definition when discussing the concept. Regulatory determinations are fact-specific.", "q": "Which combination is central to LSBN's abandonment discussion?", "opts": ["Accepted responsibility, notice, and continuity of care", "Salary, overtime, and seniority", "Documentation, billing, and insurance", "Patient satisfaction only"], "a": 0, "sec": 150}, {"title": "NCSBN definition of abandonment", "body": "NCSBN's Model Rules define abandonment as the intentional leaving of a patient for whom the nurse is responsible without providing for another nurse or appropriate caretaker to assume care when the nurse leaves.\n\nThe definition emphasizes responsibility for the patient and protection of continuity of care.\n\nThe purpose of reviewing this definition in student remediation is not to make an independent legal finding about a student's licensure. It is to understand how the same pattern of behavior\u2014accepting responsibility and failing to assure continuation of care\u2014can become a serious regulatory matter in licensed nursing practice.", "q": "What does the NCSBN definition emphasize?", "opts": ["Whether the nurse likes the assignment", "Responsibility for the patient and arranging an appropriate caregiver to assume care", "Whether the patient is insured", "Whether the nurse worked overtime"], "a": 1, "sec": 150}, {"title": "LSBN example: leaving without coverage", "body": "LSBN's published guidance lists leaving a patient without adequately providing arrangements for coverage as an example associated with patient abandonment.\n\nCoverage matters because nursing care must continue even when the originally assigned nurse cannot continue the responsibility.\n\nA nurse who cannot fulfill an assignment should not assume that another person will automatically recognize the gap. Appropriate notice allows the agency or supervisor to make a deliberate plan for coverage.", "q": "Why are coverage arrangements important?", "opts": ["They protect continuity of nursing care", "They remove all accountability from the nurse", "They are only for payroll", "They matter only in hospitals"], "a": 0, "sec": 150}, {"title": "LSBN example: inadequate notice", "body": "LSBN also identifies leaving abruptly without adequate notice so the nurse can be replaced as an example associated with abandonment.\n\nNotice is not merely a courtesy. Timely notification gives the responsible organization an opportunity to evaluate the patient's needs, identify replacement personnel, reschedule care if appropriate, or implement another safe plan.\n\nThe exact notification process depends on program and agency policy. The professional principle is consistent: notify the correct person promptly enough to allow a safe response whenever possible.", "q": "What is the patient-safety purpose of timely notice?", "opts": ["To allow a safe plan for continued care", "To guarantee no consequences", "To reduce documentation", "To excuse any absence"], "a": 0, "sec": 150}, {"title": "LSBN example: failure to report to the oncoming shift", "body": "LSBN lists leaving without reporting to the oncoming shift among examples related to abandonment.\n\nHandoff is a safety process. It transfers critical information and makes it clear who is assuming responsibility.\n\nAlthough a no-call/no-show occurs before an in-person handoff can happen, the same continuity principle is relevant: nursing care cannot safely depend on assumptions about who will recognize an uncommunicated absence.", "q": "Why is handoff relevant to this topic?", "opts": ["It establishes continuity and transfer of responsibility", "It is mainly a billing requirement", "It eliminates the need for schedules", "It is optional when staffing is short"], "a": 0, "sec": 150}, {"title": "NCSBN Model Rules: leaving an assignment", "body": "NCSBN Model Rules include conduct such as leaving a nursing assignment before proper reporting and notification to the appropriate department head or personnel, and knowingly abandoning a patient in need of nursing care, among examples of conduct that may violate regulatory standards.\n\nThis reinforces a central theme: professional nursing responsibilities include communication, reporting, and continuity\u2014not simply physical presence.\n\nAn assigned responsibility cannot be safely ended through silence.", "q": "Which behavior is specifically reflected in NCSBN Model Rules?", "opts": ["Leaving an assignment before proper reporting and notification", "Refusing voluntary overtime", "Taking an approved vacation", "Requesting orientation"], "a": 0, "sec": 150}, {"title": "The sole-provider situation", "body": "A no-call/no-show can be particularly serious when the absent nurse is the sole expected provider for a scheduled episode of care.\n\nImagine a patient expecting a home-health, private-duty, hospice, infusion, or other community-based visit. If the assigned provider does not appear and does not notify the agency, no other nurse may be physically present to recognize the absence.\n\nThe risk is not simply that staffing is inconvenient. The patient may be left without an expected assessment, medication, treatment, monitoring, or response plan.", "q": "Why does sole-provider status increase the seriousness?", "opts": ["There may be no other clinician present to recognize and cover the gap", "The nurse is paid more", "Sole providers do not need supervisors", "It always causes injury"], "a": 0, "sec": 150}, {"title": "Potential consequence: missed assessment", "body": "Nursing assessment is often the first opportunity to recognize deterioration.\n\nIf an expected nurse does not report, the patient may miss a scheduled assessment of respiratory status, neurological status, wound condition, pain, hydration, infection signs, infusion response, or other clinically important findings.\n\nA missed assessment may delay recognition of a problem that would otherwise have triggered intervention or escalation.", "q": "What is a key risk of a missed nursing assessment?", "opts": ["Delayed recognition of deterioration", "Automatic discharge", "Improved continuity", "Reduced need for documentation"], "a": 0, "sec": 150}, {"title": "Potential consequence: delayed medication or treatment", "body": "Some nursing assignments include time-sensitive medications, infusions, wound care, line care, treatments, or monitoring.\n\nWhen an assigned nurse does not report and no notice is given, the organization loses valuable time that could have been used to arrange another qualified provider.\n\nThe safety issue is therefore both the missed care and the lost opportunity to plan replacement care.", "q": "What makes a no-call/no-show different from a timely call-out?", "opts": ["The lost opportunity to arrange replacement care", "The nurse cannot ever be absent", "The medication is always omitted permanently", "There is no difference"], "a": 0, "sec": 150}, {"title": "Potential consequence: delayed escalation", "body": "Patients can deteriorate between scheduled visits or during periods in which a nurse is expected to monitor them.\n\nIf the expected nurse is absent, warning signs may go unrecognized or may be recognized later than planned. Families may also be unsure whom to contact or may delay seeking help because they expect the nurse to arrive.\n\nPatient-safety systems work best when expected care occurs or when changes to the plan are communicated clearly.", "q": "What can an uncommunicated absence delay?", "opts": ["Recognition and escalation of a change in condition", "The nurse's lunch break", "Only nonclinical paperwork", "Nothing if the patient is at home"], "a": 0, "sec": 150}, {"title": "Actual harm is not the only concern", "body": "A serious safety event does not have to end in permanent patient injury before the underlying behavior deserves attention.\n\nNCSBN's Adverse Events Decision Pathway encourages evaluation of behavioral choices, risk, circumstances, and system factors after adverse events. It reflects a balance between fairness and the need to learn from mistakes and take action when appropriate.\n\nFor remediation, the focus is on recognizing the risk created by the behavior and preventing recurrence.", "q": "Why can remediation be appropriate even when no injury occurred?", "opts": ["Because the behavior may still create substantial patient-safety risk", "Because every error requires license revocation", "Because outcomes never matter", "Because intent is irrelevant in every situation"], "a": 0, "sec": 150}, {"title": "Calling out is not the same as no-call/no-show", "body": "Nurses become ill. Family emergencies occur. Transportation can fail. Professional accountability does not mean that a nurse can never miss work or clinical.\n\nThe difference is timely, appropriate communication.\n\nA professional call-out follows the required procedure, reaches the correct person, occurs as soon as reasonably possible, and gives the organization an opportunity to protect continuity of care.", "q": "What distinguishes an appropriate call-out from a no-call/no-show?", "opts": ["Timely notification through the required process", "Whether the nurse is embarrassed", "Whether a classmate knows", "Whether the nurse plans to return next week"], "a": 0, "sec": 150}, {"title": "Who must be notified?", "body": "Policies vary, but professional notification should reach the person or system designated to act on the information.\n\nTelling a classmate is not equivalent to notifying faculty. Posting in a group message is not equivalent to notifying a supervisor. Leaving a message with someone who has no responsibility for staffing may not satisfy the required process.\n\nStudents and nurses should know the call-out procedure before an emergency occurs.", "q": "Which notification is most appropriate?", "opts": ["Direct notification to the person/system designated by policy", "A social-media post", "A classmate only", "No notification if the reason is understandable"], "a": 0, "sec": 150}, {"title": "Why timing of notification matters", "body": "The earlier the responsible person learns that an assigned provider will not report, the more options exist.\n\nCoverage may be arranged. Patient visits may be rescheduled. Another nurse may be reassigned. The patient or family may receive alternate instructions. Urgent needs may be identified.\n\nWaiting until after the shift begins\u2014or until someone contacts the absent person\u2014reduces those options.", "q": "Why should notification occur as soon as possible?", "opts": ["It preserves options for safe coverage and continuity planning", "It guarantees the absence is excused", "It avoids all documentation", "It transfers responsibility to the patient"], "a": 0, "sec": 150}, {"title": "The role of intent", "body": "Regulatory definitions may include intent, and legal conclusions depend on the specific facts and jurisdiction. Educational remediation should therefore avoid assuming that every missed shift is legally identical.\n\nHowever, absence of malicious intent does not eliminate the need to examine professional responsibility, preventable risk, and communication failures.\n\n\u201cI did not mean for this to happen\u201d is different from \u201cthere was no professional responsibility.\u201d", "q": "Which statement is most accurate?", "opts": ["Lack of malicious intent does not eliminate the need to address risk and accountability", "Intent never matters legally", "Every missed shift is automatically abandonment", "A mistake can never be remediated"], "a": 0, "sec": 150}, {"title": "Regulatory purpose: protection of the public", "body": "Boards of nursing regulate nursing practice to protect the public.\n\nNCSBN explains that boards review complaints, investigate matters within their jurisdiction, and may impose actions when violations are established. Available actions vary by jurisdiction and circumstances.\n\nThis is why nursing students should learn professional accountability before licensure: behaviors developed during education can carry much greater consequences once the individual is practicing under a nursing license.", "q": "What is the primary purpose of nursing regulation?", "opts": ["Protection of the public", "Protecting employers from overtime", "Setting school calendars", "Managing hospital budgets"], "a": 0, "sec": 150}, {"title": "Possible board actions after a violation", "body": "NCSBN notes that board actions vary by jurisdiction and may include education or remediation, reprimand, fines, probation or restrictions, suspension, or loss of licensure in more serious circumstances.\n\nThis does not mean a no-call/no-show automatically produces a particular sanction. It means that conduct involving professional responsibility and patient safety can fall within regulatory processes.\n\nThe appropriate response depends on facts, law, policy, history, risk, and the board's authority.", "q": "Which statement about board action is accurate?", "opts": ["Actions vary based on law and circumstances", "Every attendance error causes revocation", "Boards cannot require remediation", "Only employers may address professional conduct"], "a": 0, "sec": 150}, {"title": "Professional reputation and trust", "body": "Nursing depends heavily on trust.\n\nPatients trust that expected care will occur. Coworkers trust that assigned nurses will report. Supervisors trust that staff will communicate when plans change. Clinical agencies trust nursing programs to prepare students who behave professionally.\n\nReliability is therefore part of a nurse's professional reputation, not simply a personal organizational skill.", "q": "Why does reliability matter professionally?", "opts": ["Others must be able to trust that accepted responsibilities will be fulfilled or communicated appropriately", "It only affects grades", "It is unrelated to patient care", "It matters only for managers"], "a": 0, "sec": 150}, {"title": "Impact on coworkers and staffing", "body": "An unanticipated absence can force other clinicians to absorb additional work, delay other patients' care, work beyond planned hours, or urgently rearrange assignments.\n\nWhen the absence is communicated early, leaders can make safer staffing decisions. When it is discovered only because the person fails to appear, the response is reactive.\n\nProfessional attendance therefore affects team workload as well as individual responsibility.", "q": "How can a no-call/no-show affect coworkers?", "opts": ["It can create unplanned workload and urgent reassignment", "It has no effect if the patient is stable", "It reduces staffing needs", "It automatically cancels care"], "a": 0, "sec": 150}, {"title": "Impact on clinical agencies and nursing programs", "body": "Clinical placements depend on relationships between academic programs and healthcare organizations.\n\nAgencies expect students to comply with schedules, communication requirements, privacy rules, safety procedures, and professional standards. Repeated or serious professionalism problems can strain those relationships and affect future placement opportunities.\n\nA student's conduct can therefore have consequences beyond the individual student.", "q": "Why can student professionalism affect the nursing program?", "opts": ["Clinical agencies rely on the program to send dependable, professional students", "Only grades matter to agencies", "Agencies do not notice attendance", "Students never represent their program"], "a": 0, "sec": 150}, {"title": "Personal systems prevent predictable errors", "body": "Human memory is imperfect. Professional practice uses systems to reduce predictable errors.\n\nA strong scheduling system includes an official source of truth, electronic calendar entries, multiple reminders, routine weekly review, a 48-hour check, and a night-before check.\n\nThe purpose is not to prove that a person has a good memory. The purpose is to design a process that remains reliable even when life is busy.", "q": "What is the safest approach to schedule management?", "opts": ["Use redundant systems rather than memory alone", "Depend on one reminder", "Wait for faculty texts", "Check only on the morning of clinical"], "a": 0, "sec": 150}, {"title": "The 48-hour verification", "body": "Forty-eight hours before each clinical assignment, verify the date, location, reporting time, faculty or preceptor information, preparation requirements, required equipment, dress requirements, transportation plan, and any recent announcements.\n\nThis checkpoint creates time to resolve discrepancies.\n\nIf the location or time is unclear, clarification should occur before the day of the assignment.", "q": "What is the purpose of a 48-hour verification?", "opts": ["To identify and resolve problems before the clinical day", "To replace the official schedule", "To notify the patient of grades", "To avoid using a calendar"], "a": 0, "sec": 150}, {"title": "The night-before verification", "body": "The night before clinical, recheck the official schedule and prepare the items needed for the next day.\n\nConfirm transportation and travel time. Set alarms. Confirm required equipment, identification, paperwork, and attire.\n\nThis final verification catches changes or errors before the reporting deadline.", "q": "Why add a night-before check if a 48-hour check already occurred?", "opts": ["Redundant checks reduce the chance that a change or error will be missed", "It is required by NCSBN for every nurse", "It eliminates the need for an alarm", "It allows classmates to take responsibility"], "a": 0, "sec": 150}, {"title": "Clarify uncertainty instead of assuming", "body": "If there is uncertainty about whether you are scheduled, the safe response is to verify.\n\nAssumptions are particularly risky when they concern patient-care responsibilities. A short clarification message before the shift is far safer than discovering after the reporting time that the assumption was wrong.\n\nProfessional communication should occur before uncertainty becomes an absence.", "q": "What should a student do if the schedule is unclear?", "opts": ["Clarify with the appropriate faculty member before the scheduled time", "Assume the shift is cancelled", "Wait for a classmate", "Do nothing unless contacted"], "a": 0, "sec": 150}, {"title": "Emergency notification plan", "body": "Every student should know the emergency notification process before needing it.\n\nThe plan should identify whom to contact, which method to use, whether a phone call is required, whether the clinical agency must also be notified, what information to provide, and whether follow-up documentation is required.\n\nA plan created in advance reduces delay during an actual emergency.", "q": "When should the call-out process be learned?", "opts": ["Before an emergency occurs", "Only after the first absence", "After the shift ends", "Only after licensure"], "a": 0, "sec": 150}, {"title": "Corrective action must be measurable", "body": "A meaningful corrective plan describes observable behaviors.\n\n\u201cI will do better\u201d is not measurable.\n\n\u201cI will enter every clinical date into my phone calendar, use a 48-hour reminder and a night-before reminder, review the official schedule every Sunday, and contact faculty immediately if anything is unclear\u201d is measurable.\n\nProfessional remediation should result in a system that can be followed consistently.", "q": "Which plan is most measurable?", "opts": ["I will try harder", "I will remember next time", "I will use defined schedule checks and redundant reminders", "My friends will remind me"], "a": 2, "sec": 150}, {"title": "Self-reflection is part of professional accountability", "body": "NCSBN has long discussed self-reflection as an element of professional accountability.\n\nReflection is not intended to produce a particular emotional response. Its purpose is to identify decisions, assumptions, system failures, and behaviors that can be changed.\n\nA useful reflection asks: What did I know? What did I assume? What did I fail to verify? When could I have intervened? What system will I use next time?", "q": "What is the purpose of professional reflection?", "opts": ["To identify changeable decisions and systems that can prevent recurrence", "To assign blame to others", "To prove the student feels bad", "To replace policy review"], "a": 0, "sec": 150}, {"title": "Applying this to future licensed practice", "body": "The habits built during nursing school become the foundation for licensed practice.\n\nAfter licensure, a nurse may be responsible for multiple patients, controlled medications, infusions, home visits, emergency assessment, delegation, handoff, and other obligations that cannot safely depend on casual schedule management.\n\nTreating clinical schedules professionally now is preparation for the responsibilities attached to a nursing license.", "q": "Why address attendance habits during nursing education?", "opts": ["They are part of preparing for licensed responsibilities and patient safety", "They matter only for school policy", "Licensed nurses receive daily reminders", "Schedules are less important after graduation"], "a": 0, "sec": 150}, {"title": "Final instructional synthesis", "body": "The central lesson of this module is straightforward:\n\nAn assigned patient-care responsibility must be treated as a professional obligation. If an emergency prevents attendance, timely communication allows the organization to protect continuity of care. A no-call/no-show removes that opportunity and can create significant patient-safety and professional concerns.\n\nAccountability means knowing the schedule, recognizing the consequences of inaction, communicating appropriately, and building a reliable prevention system.\n\nThe next section will apply these principles to realistic nursing scenarios.", "q": "Which statement best summarizes the module?", "opts": ["Accepted responsibilities require reliable attendance or timely communication to protect continuity of care", "Attendance is primarily a personal preference", "Only actual injury makes an absence serious", "Schedule management belongs to faculty"], "a": 0, "sec": 150}], "scenarios": [{"title": "Scenario 1 \u2014 The home infusion visit", "body": "You are assigned as the expected provider for a scheduled home infusion visit. The patient is expecting nursing assessment, line evaluation, medication administration, and monitoring. You misread your calendar and do not report. You also do not contact the agency.\n\nConsider what happens before anyone realizes you are absent: the patient waits; the infusion does not begin; no nurse assesses the line or baseline status; the agency has not had an opportunity to arrange a replacement.\n\nThe issue is not merely that you were absent. The lack of notice removed the agency's opportunity to protect continuity of care.", "q": "What is the most important immediate concern?", "opts": ["The agency's payroll records", "The patient may be without expected nursing assessment and treatment, with no replacement arranged", "Whether the nurse intended to be late", "Whether another student knew the schedule"], "a": 1, "sec": 180}, {"title": "Scenario 2 \u2014 The timely emergency call-out", "body": "You wake with vomiting and fever before a scheduled clinical shift. You know you cannot safely participate. You immediately follow the program's call-out procedure, contact the designated faculty member, and provide the required information. Faculty and the agency are able to adjust the plan.\n\nThe absence may still require make-up work or other consequences under school policy, but the professional behavior is different from simply failing to report.", "q": "What is the key professional difference?", "opts": ["The illness automatically excuses all requirements", "Timely notification allowed the program/agency to respond and protect the plan of care", "The student did not need to know the schedule", "No documentation is needed"], "a": 1, "sec": 180}, {"title": "Scenario 3 \u2014 Telling a classmate", "body": "You realize you cannot attend clinical and text a classmate: \u201cTell the instructor I won't be there.\u201d The classmate becomes busy and does not see the message until after clinical begins.\n\nProfessional notification must reach the person or system responsible for acting on the information. A peer may be supportive, but a peer is not a substitute for the  <p><strong>Pre-Test:</strong> ${state.preScore}% &nbsp; | &nbsp; <strong>Attempt:</strong> ${state.attempt}</p>
 <p><strong>Active Module Time:</strong> ${fmt(state.activeSeconds)}</p>
 <p><strong>Completed:</strong> ${d.toLocaleString()}</p>
 <p><strong>Verification Code:</strong> ${verifyCode()}</p>
 <hr><p class="small">Institution-created remediation module based on published LSBN and NCSBN regulatory/educational resources. This is not an LSBN- or NCSBN-issued continuing-education certificate.</p></div>
 <div class="row no-print"><button class="gray" onclick="completionRecord()">View Completion Record</button><button onclick="window.print()">Print / Save Certificate as PDF</button></div>`;
}
function completionRecord(){
 app.innerHTML=`<h2>Completion Record</h2><table>
 <tr><th>Student</th><td>${esc(state.student)}</td></tr><tr><th>Attempt</th><td>${state.attempt}</td></tr>
 <tr><th>Pre-Test</th><td>${state.preScore}%</td></tr><tr><th>Post-Test</th><td>${state.postScore}%</td></tr>
 <tr><th>Active module time</th><td>${fmt(state.activeSeconds)}</td></tr><tr><th>Verification code</th><td>${verifyCode()}</td></tr></table>
 <h3>Personal Accountability Plan</h3><div class="callout">${esc(state.reflection).replace(/\n/g,"<br>")}</div>
 <div class="row no-print"><button onclick="renderPassed()">Back to Certificate</button></div>`;
}
function route(){
 header();
 if(state.phase==="intro")intro(); else if(state.phase==="pre")renderPre(); else if(state.phase==="learn")renderLearning();
 else if(state.phase==="scenario")renderScenario(); else if(state.phase==="reflection")renderReflection(); else if(state.phase==="review")renderReview();
 else if(state.phase==="post")renderPost(); else if(state.phase==="passed")renderPassed(); else intro();
}
load();route();
</script>
</body></html>
